<text x="80" y="823" font-size="21" text-anchor="start" fill="#475761" font-weight="normal" >峰幅削弱率 = (1 − A₈% / A₅%) × 100%；A为同频率单位参与运动的绝对峰。</text>
<text x="80" y="864" font-size="21" text-anchor="start" fill="#475761" font-weight="normal" >该幅比与共同的非零参与因子、模态归一化常数无关；不表示楼层剪力贡献。</text>
<text x="80" y="905" font-size="21" text-anchor="start" fill="#475761" font-weight="normal" >参与因子 Γ = 0 时，实际该模态不受激；本图仍表示单位参与运动。</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1080" viewBox="0 0 1500 1080"><title>SHW3X第5层与屋顶的5%模态独立峰幅权重</title><desc>Fixed categories Modes2,10,13,18 and all remaining296 modes; actual300 elastic inertia linear reference. Independent modal envelope weights, not same-time shear shares or energy fractions.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#202C34"><text x="75" y="65" font-size="34" text-anchor="start" fill="#202C34" font-weight="700" >SHW3X：第5层与屋顶的5%模态独立峰幅权重</text><text x="75" y="109" font-size="23" text-anchor="start" fill="#50616B" font-weight="400" >全300阶弹性惯性线性参照 · w = a / Σa · a = 该阶完整时程的 max |v(t)|</text><rect x="90" y="148" width="27" height="22" fill="#1D5C88"/><text x="132" y="168" font-size="23" text-anchor="start" fill="#202C34" font-weight="400" >第5层</text><rect x="380" y="148" width="27" height="22" fill="#C0622A"/><text x="422" y="168" font-size="23" text-anchor="start" fill="#202C34" font-weight="400" >第12层（屋顶）</text><line x1="260.0" y1="220" x2="260.0" y2="790" stroke="#DCE3E8" stroke-width="1"/><text x="260.0" y="829" font-size="21" text-anchor="middle" fill="#202C34" font-weight="400" >0</text><line x1="418.57142857142856" y1="220" x2="418.57142857142856" y2="790" stroke="#DCE3E8" stroke-width="1"/><text x="418.57142857142856" y="829" font-size="21" text-anchor="middle" fill="#202C34" font-weight="400" >10</text><line x1="577.1428571428571" y1="220" x2="577.1428571428571" y2="790" stroke="#DCE3E8" stroke-width="1"/><text x="577.1428571428571" y="829" font-size="21" text-anchor="middle" fill="#202C34" font-weight="400" >20</text><line x1="735.7142857142857" y1="220" x2="735.7142857142857" y2="790" stroke="#DCE3E8" stroke-width="1"/><text x="735.7142857142857" y="829" font-size="21" text-anchor="middle" fill="#202C34" font-weight="400" >30</text><line x1="894.2857142857142" y1="220" x2="894.2857142857142" y2="790" stroke="#DCE3E8" stroke-width="1"/><text x="894.2857142857142" y="829" font-size="21" text-anchor="middle" fill="#202C34" font-weight="400" >40</text><line x1="1052.857142857143" y1="220" x2="1052.857142857143" y2="790" stroke="#DCE3E8" stroke-width="1"/><text x="1052.857142857143" y="829" font-size="21" text-anchor="middle" fill="#202C34" font-weight="400" >50</text><line x1="1211.4285714285713" y1="220" x2="1211.4285714285713" y2="790" stroke="#DCE3E8" stroke-width="1"/><text x="1211.4285714285713" y="829" font-size="21" text-anchor="middle" fill="#202C34" font-weight="400" >60</text><line x1="1370.0" y1="220" x2="1370.0" y2="790" stroke="#DCE3E8" stroke-width="1"/><text x="1370.0" y="829" font-size="21" text-anchor="middle" fill="#202C34" font-weight="400" >70</text><line x1="260" y1="220" x2="260" y2="790" stroke="#62727D" stroke-width="1.5"/><line x1="260" y1="790" x2="1370" y2="790" stroke="#62727D" stroke-width="1.5"/><text x="233" y="282" font-size="23" text-anchor="end" fill="#202C34" font-weight="400" >第2阶</text><rect x="260" y="247" width="1055.333439013521" height="24" fill="#1D5C88"/><text x="1326.333439013521" y="268" font-size="22" text-anchor="start" fill="#1D5C88" font-weight="400" >66.55%</text><rect x="260" y="284" width="177.3815556972075" height="24" fill="#C0622A"/><text x="448.3815556972075" y="305" font-size="22" text-anchor="start" fill="#C0622A" font-weight="400" >11.19%</text><text x="233" y="390" font-size="23" text-anchor="end" fill="#202C34" font-weight="400" >第10阶</text><rect x="260" y="355" width="251.17776499523018" height="24" fill="#1D5C88"/><text x="522.1777649952302" y="376" font-size="22" text-anchor="start" fill="#1D5C88" font-weight="400" >15.84%</text><rect x="260" y="392" width="424.2175779881279" height="24" fill="#C0622A"/><text x="695.2175779881279" y="413" font-size="22" text-anchor="start" fill="#C0622A" font-weight="400" >26.75%</text><text x="233" y="498" font-size="23" text-anchor="end" fill="#202C34" font-weight="400" >第13阶</text><rect x="260" y="463" width="63.30176539032357" height="24" fill="#1D5C88"/><text x="334.30176539032357" y="484" font-size="22" text-anchor="start" fill="#1D5C88" font-weight="400" >3.99%</text><rect x="260" y="500" width="469.88589130719606" height="24" fill="#C0622A"/><text x="740.8858913071961" y="521" font-size="22" text-anchor="start" fill="#C0622A" font-weight="400" >29.63%</text><text x="233" y="606" font-size="23" text-anchor="end" fill="#202C34" font-weight="400" >第18阶</text><rect x="260" y="571" width="16.939853831101402" height="24" fill="#1D5C88"/><text x="287.9398538311014" y="592" font-size="22" text-anchor="start" fill="#1D5C88" font-weight="400" >1.07%</text><rect x="260" y="608" width="98.41412388513243" height="24" fill="#C0622A"/><text x="369.4141238851324" y="629" font-size="22" text-anchor="start" fill="#C0622A" font-weight="400" >6.21%</text><text x="233" y="714" font-size="23" text-anchor="end" fill="#202C34" font-weight="400" >其他296阶</text><rect x="260" y="679" width="198.9614624841098" height="24" fill="#1D5C88"/><text x="469.9614624841098" y="700" font-size="22" text-anchor="start" fill="#1D5C88" font-weight="400" >12.55%</text><rect x="260" y="716" width="415.81513683662195" height="24" fill="#C0622A"/><text x="686.815136836622" y="737" font-size="22" text-anchor="start" fill="#C0622A" font-weight="400" >26.22%</text><text x="815.0" y="873" font-size="24" text-anchor="middle" fill="#202C34" font-weight="400" >独立峰幅权重（%）</text><text x="75" y="925" font-size="22" text-anchor="start" fill="#50616B" font-weight="400" >“其他”包含除2、10、13、18阶以外的296阶；每层全部五类之和为100%。</text><text x="75" y="966" font-size="22" text-anchor="start" fill="#50616B" font-weight="400" >各阶独立峰可能出现在不同时刻；这些权重不是同刻剪力份额，也不是能量比例。</text><text x="75" y="1007" font-size="22" text-anchor="start" fill="#50616B" font-weight="400" >取实际模态基的弹性惯性线性参照，尚不等同原生FNA的唯一逐阶内力分解。</text></g></svg>

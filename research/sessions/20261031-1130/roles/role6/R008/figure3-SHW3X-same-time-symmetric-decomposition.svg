<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="940" viewBox="0 0 1500 940"><title>SHW3X：同刻削弱量的对称分解</title><desc>Two frozen same-time modal symmetric decomposition sums, along the old5percent reference sign. Independent kN axes. Normalized waveform change is not pure phase; not a difference between two independent response peaks. Scientific independent review pending.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#202C34"><text x="75" y="66" font-size="34" text-anchor="start" fill="#202C34" font-weight="700" >SHW3X：同刻削弱量的对称分解</text><text x="75" y="110" font-size="23" text-anchor="start" fill="#50616B" font-weight="400" >阻尼比5% → 8% · 逐阶同刻分解后求和 · 两面板采用独立kN纵轴</text><text x="412.5" y="186" font-size="25" text-anchor="middle" fill="#202C34" font-weight="700" >(a) 第5层 · t = 22.92 s</text><line x1="135" y1="670.0" x2="690" y2="670.0" stroke="#E1E7EB" stroke-width="1"/><text x="115" y="677.0" font-size="21" text-anchor="end" fill="#202C34" font-weight="400" >-200</text><line x1="135" y1="583.0" x2="690" y2="583.0" stroke="#77858F" stroke-width="1.8"/><text x="115" y="590.0" font-size="21" text-anchor="end" fill="#202C34" font-weight="400" >0</text><line x1="135" y1="496.0" x2="690" y2="496.0" stroke="#E1E7EB" stroke-width="1"/><text x="115" y="503.0" font-size="21" text-anchor="end" fill="#202C34" font-weight="400" >200</text><line x1="135" y1="409.0" x2="690" y2="409.0" stroke="#E1E7EB" stroke-width="1"/><text x="115" y="416.0" font-size="21" text-anchor="end" fill="#202C34" font-weight="400" >400</text><line x1="135" y1="322.0" x2="690" y2="322.0" stroke="#E1E7EB" stroke-width="1"/><text x="115" y="329.0" font-size="21" text-anchor="end" fill="#202C34" font-weight="400" >600</text><line x1="135" y1="235.0" x2="690" y2="235.0" stroke="#E1E7EB" stroke-width="1"/><text x="115" y="242.0" font-size="21" text-anchor="end" fill="#202C34" font-weight="400" >800</text><line x1="135" y1="235" x
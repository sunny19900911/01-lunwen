040208" fill="#4E5F6C"/><rect x="1272" y="281.8324597959792" width="130" height="31" fill="white"/><text x="1337" y="306.8324597959792" font-size="23" text-anchor="middle" fill="#4E5F6C" font-weight="700" >+240.805</text><text x="1337" y="742" font-size="22" text-anchor="middle" fill="#202C34" font-weight="400" >同刻净削弱</text><text x="75" y="833" font-size="22" text-anchor="start" fill="#50616B" font-weight="400" >同一时刻的对称分解：正值为沿原5%参照方向削弱，负值为抵消削弱。</text><text x="75" y="877" font-size="22" text-anchor="start" fill="#50616B" font-weight="400" >归一波形项不是纯相位；同刻净削弱不能当作两状态各自峰值之差。</text></g></svg>
